# Site configuration. Theme options live in params.toml, per-language settings in languages.*.toml.
# Hugo docs: https://gohugo.io/getting-started/configuration/
# Blowfish docs: https://blowfish.page/docs/getting-started/

theme = "blowfish"
baseURL = "https://www.kurtshuler.com/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # English at /, Spanish at /es/

enableRobotsTXT = true
summaryLength = 0
buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 20

[permalinks]
  posts = "/posts/:slug/"

[imaging]
  anchor = "Center"

[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "series"
    weight = 50
  [[related.indices]]
    name = "date"
    weight = 10
